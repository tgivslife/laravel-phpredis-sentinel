name: ci

on:
  push:
    branches:
      - main
      - '*.x'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  minimum_php: '8.3'
  extensions: dom, curl, libxml, mbstring, zip, fileinfo, sqlite3, pdo_sqlite, redis-6.3.0

jobs:
  static:
    name: Static analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ env.minimum_php }}
          extensions: ${{ env.extensions }}
          ini-values: error_reporting=E_ALL
          tools: composer:v2
          coverage: none
        env:
          fail-fast: true

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Validate composer.json
        run: composer validate --strict

      - name: Pint
        run: composer lint:check

      - name: PHPStan
        run: composer analyse

  dependencies:
    name: Runtime dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ env.minimum_php }}
          extensions: ${{ env.extensions }}
          tools: composer:v2, composer-dependency-analyser
          coverage: none
        env:
          fail-fast: true

      # Resolve without require-dev: Testbench would otherwise install laravel/framework,
      # which replaces the illuminate/* components and hides missing runtime requirements.
      - name: Resolve the runtime-only dependency graph
        run: |
          php -r '$c = json_decode(file_get_contents("composer.json"), true); unset($c["require-dev"], $c["autoload-dev"]); file_put_contents("composer.json", json_encode($c, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES));'
          composer update --prefer-dist --no-interaction --no-progress

      - name: Check platform requirements
        run: composer check-platform-reqs

      - name: Analyse dependencies
        run: composer-dependency-analyser

  tests:
    name: P${{ matrix.php }} - L13 - ${{ matrix.stability }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        php: ['8.3', '8.4', '8.5']
        stability: [prefer-lowest, prefer-stable]
        include:
          - os: windows-latest
            php: '8.5'
            stability: prefer-stable

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ env.extensions }}
          ini-values: error_reporting=E_ALL
          tools: composer:v2
          coverage: none
        env:
          fail-fast: true

      - name: Install dependencies
        run: composer update --${{ matrix.stability }} --prefer-dist --no-interaction --no-progress

      - name: Unit and Feature suites
        run: vendor/bin/phpunit
