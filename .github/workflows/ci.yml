name: ci

on:
  push:
    branches:
      - main
      - '*.x'
  pull_request:
  # Weekly, so a Laravel or phpredis release is tested before an application upgrades to it, commit or not.
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  minimum_php: '8.3'
  extensions: dom, curl, libxml, mbstring, zip, fileinfo, sqlite3, pdo_sqlite
  # The declared floor (ext-redis ^6.3). Jobs that test the newest dependencies take the newest phpredis instead.
  minimum_redis: redis-6.3.0

jobs:
  static:
    name: Static analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ env.minimum_php }}
          extensions: ${{ env.extensions }}, ${{ env.minimum_redis }}
          ini-values: error_reporting=E_ALL
          tools: composer:v2
          coverage: none
        env:
          fail-fast: true

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Validate composer.json
        run: composer validate --strict

      - name: Pint
        run: composer lint:check

      - name: PHPStan
        run: composer analyse

  dependencies:
    name: Runtime dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ env.minimum_php }}
          extensions: ${{ env.extensions }}, ${{ env.minimum_redis }}
          tools: composer:v2, composer-dependency-analyser
          coverage: none
        env:
          fail-fast: true

      # Resolve without require-dev: Testbench would otherwise install laravel/framework,
      # which replaces the illuminate/* components and hides missing runtime requirements.
      - name: Resolve the runtime-only dependency graph
        run: |
          php -r '$c = json_decode(file_get_contents("composer.json"), true); unset($c["require-dev"], $c["autoload-dev"]); file_put_contents("composer.json", json_encode($c, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES));'
          composer update --prefer-dist --no-interaction --no-progress

      - name: Check platform requirements
        run: composer check-platform-reqs

      - name: Analyse dependencies
        run: composer-dependency-analyser

  tests:
    name: P${{ matrix.php }} - L13 - ${{ matrix.stability }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        php: ['8.3', '8.4', '8.5']
        stability: [prefer-lowest, prefer-stable]
        include:
          - os: windows-latest
            php: '8.5'
            stability: prefer-stable

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          # The floor with the lowest dependencies; otherwise the newest phpredis the runner's source offers.
          extensions: ${{ env.extensions }}, ${{ matrix.stability == 'prefer-lowest' && env.minimum_redis || 'redis' }}
          ini-values: error_reporting=E_ALL
          tools: composer:v2
          coverage: none
        env:
          fail-fast: true

      # A green run's log goes unread, so a runner whose source trails PECL is reported as a warning annotation,
      # which the run's summary shows; the job stays green, since the lag is the runner's, not the package's.
      - name: phpredis version
        shell: bash
        run: |
          loaded=$(php -r "echo phpversion('redis');")
          newest=$(curl -fsS -m 20 https://pecl.php.net/rest/r/redis/stable.txt || echo unknown)
          echo "phpredis ${loaded} (newest stable on PECL: ${newest})"
          if [ '${{ matrix.stability }}' = prefer-stable ] && [ "${newest}" != unknown ] && [ "${loaded}" != "${newest}" ]; then
            echo "::warning title=phpredis behind PECL::${loaded} is loaded; PECL's newest stable is ${newest}, which the runner's source does not offer yet"
          fi

      - name: Install dependencies
        run: composer update --${{ matrix.stability }} --prefer-dist --no-interaction --no-progress

      # If a dependency ever raised its own minimum, --prefer-lowest would quietly move past the declared floor, and
      # the floor composer.json promises would no longer be tested anywhere. Every illuminate/* requirement must name
      # the same ^major.minor floor, or one of them would promise a release the others rule out.
      - name: Laravel floor
        if: matrix.stability == 'prefer-lowest'
        shell: bash
        run: |
          php -r '
            $floors = [];
            foreach (json_decode(file_get_contents("composer.json"), true)["require"] as $package => $constraint) {
                if (str_starts_with($package, "illuminate/")) {
                    $floors[$package] = preg_match("/^\^(\d+\.\d+)$/", $constraint, $m) === 1 ? $m[1].".0" : $constraint;
                }
            }
            $floor = array_unique($floors);
            if (count($floor) !== 1 || preg_match("/^\d+\.\d+\.0$/", (string) reset($floor)) !== 1) {
                echo "::error title=Illuminate constraints disagree::every illuminate/* requirement must share one ^major.minor floor: ", json_encode($floors, JSON_UNESCAPED_SLASHES), PHP_EOL;
                exit(1);
            }
            $floor = reset($floor);
            foreach (json_decode(file_get_contents("vendor/composer/installed.json"), true)["packages"] as $package) {
                if ($package["name"] === "laravel/framework") {
                    $installed = ltrim($package["version"], "v");
                }
            }
            $installed ??= "none";
            echo "laravel/framework {$installed} (declared floor {$floor})", PHP_EOL;
            if ($installed !== $floor) {
                echo "::error title=Laravel floor not tested::--prefer-lowest resolved {$installed}, not the declared floor {$floor}: a dependency raised the minimum; review it, then raise the floor", PHP_EOL;
                exit(1);
            }
          '

      - name: Unit and Feature suites
        run: vendor/bin/phpunit

  servers:
    name: Redis and Sentinel servers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Start
        run: composer servers:reset

      # From the runner through the published ports, where a client outside the servers' namespace reaches them.
      - name: Reset after a failover
        shell: bash
        run: |
          master() { docker run --rm --network host redis:7.4-alpine redis-cli -p 26390 sentinel get-master-addr-by-name mymaster | paste -sd:; }
          expect() {
            if [ "$(master)" != 127.0.0.1:6390 ]; then
              echo "::error title=Not canonical::$1: the sentinels name $(master), not 127.0.0.1:6390"
              exit 1
            fi
          }
          expect 'after the start'
          docker compose --file docker/compose.yaml exec -T sentinel-1 redis-cli -p 26390 sentinel failover mymaster
          for attempt in $(seq 1 20); do [ "$(master)" != 127.0.0.1:6390 ] && break; sleep 0.5; done
          if [ "$(master)" = 127.0.0.1:6390 ]; then
            echo '::error title=No failover::the sentinels still name 127.0.0.1:6390 10 s after SENTINEL FAILOVER'
            exit 1
          fi
          echo "after the failover: $(master)"
          composer servers:reset
          expect 'after the reset'

      - name: Server logs
        if: failure()
        run: docker compose --file docker/compose.yaml logs
